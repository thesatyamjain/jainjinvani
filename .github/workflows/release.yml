name: Build & Release Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (खाली छोड़ें ऑटो-इंक्रीमेंट के लिए / Leave empty for auto v1.0.x)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # If mobile/assets/web/index.html is missing, build web assets
      - name: Verify or Build Web Assets
        run: |
          if [ ! -f "mobile/assets/web/index.html" ]; then
            echo "Mobile assets not found. Installing Node.js & building web assets..."
            npm ci
            npm run sync:mobile
          else
            echo "Pre-built web assets found in mobile/assets/web/. Skipping redundant web build to save ~3-4 minutes!"
          fi

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure Keystore Signing
        working-directory: mobile/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Configuring release signing from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
            cat <<EOF > key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            echo "Release keystore configured from GitHub Secrets."
          elif [ -f upload-keystore.jks ] && [ -f key.properties ]; then
            echo "Using committed permanent project release keystore."
          else
            echo "::warning::Keystore not found. Releases will fall back to debug signing."
          fi

      - name: Determine Release Version
        id: versioning
        run: |
          git fetch --tags --force 2>/dev/null || true
          
          INPUT_VERSION="${{ github.event.inputs.version }}"
          
          if [ -n "$INPUT_VERSION" ]; then
            TAG_NAME="$INPUT_VERSION"
            if [[ ! "$TAG_NAME" =~ ^v ]]; then
              TAG_NAME="v$TAG_NAME"
            fi
            echo "Using manual version from input: $TAG_NAME"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Using pushed git tag: $TAG_NAME"
          else
            # Auto-increment: find highest existing semantic tag
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v1.0.0"
            fi
            echo "Latest tag found in repository: $LATEST_TAG"
            
            CLEAN_LATEST="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_LATEST"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            
            NEW_PATCH=$((PATCH + 1))
            TAG_NAME="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            echo "Auto-incremented release tag to: $TAG_NAME"
          fi
          
          CLEAN_VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Build Android Release APKs
        working-directory: mobile
        run: |
          CLEAN_VERSION="${{ steps.versioning.outputs.clean_version }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Building Version: $CLEAN_VERSION (Version Code: $BUILD_NUMBER)"
          flutter build apk --release --split-per-abi --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"

      - name: Prepare Release Assets
        id: prep
        run: |
          VERSION="${{ steps.versioning.outputs.tag }}"
          # Lightweight arm64 APK (recommended for 99% of modern Android devices)
          if [ -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "JainJinvani-${VERSION}-arm64.apk"
          fi
          # Universal APK (works on all architectures)
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "JainJinvani-${VERSION}-universal.apk"
          # Standard name fallback
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "JainJinvani-${VERSION}.apk"
          echo "tag_name=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Jain Jinvani Mobile App ${{ steps.versioning.outputs.tag }}
          body: |
            ## 📱 जिनवाणी मोबाइल ऐप (${{ steps.prep.outputs.tag_name }})

            जिनवाणी (Jain Jinvani) का आधिकारिक एंड्रॉइड ऐप संस्करण।

            ### ✨ मुख्य विशेषताएं (Key Features):
            - **100% ऑफ़लाइन (Offline First):** बिना इंटरनेट कनेक्शन के संपूर्ण जैन पूजा, आरती, स्तोत्र, पाठ एवं चालीसा।
            - **विशाल संग्रह:** 700+ धार्मिक रचनाएं, तीर्थंकर परिचय एवं नित्य नियम।
            - **ऑडियो प्लेयर:** णमोकार महामंत्र एवं भक्तामर स्तोत्र शुद्ध उच्चारण सहित।
            - **दिव्य डार्क मोड:** पढ़ने में अत्यंत सुगम एवं मनमोहक इंटरफ़ेस।
            - **सुपरफास्ट एवं हल्का:** 60/120 FPS स्मूथ स्क्रॉलिंग और न्यूनतम स्टोरेज उपयोग।
            - **इन-ऐप OTA अपडेट:** भविष्य के सभी अपडेट्स सीधे ऐप के अंदर 1-क्लिक में।

            ---

            ### 📥 कैसे इंस्टॉल करें (How to Install):
            1. **अनुशंसित (Recommended):** नीचे **Assets** में से **`JainJinvani-${{ steps.prep.outputs.tag_name }}-arm64.apk`** डाउनलोड करें (सभी आधुनिक फ़ोन के लिए सबसे हल्का ~35MB एवं सबसे तेज़)।
            2. **सभी फ़ोन्स के लिए (Universal):** यदि पुराना फ़ोन हो तो **`JainJinvani-${{ steps.prep.outputs.tag_name }}-universal.apk`** डाउनलोड करें।
            3. फ़ोन में डाउनलोड हुई फ़ाइल खोलें और **Install** दबाएं।
            4. यदि फ़ोन पूछे तो *"Allow installation from this source / Chrome"* को चालू करें।
          files: |
            JainJinvani-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
