name: Build & Release Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web App & Sync to Mobile Assets
        run: npm run sync:mobile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure Keystore Signing
        working-directory: mobile/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Configuring release signing from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
            cat <<EOF > key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            echo "Release keystore configured successfully."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not found. Releases will fall back to debug signing. Add GitHub Secrets to guarantee seamless in-place app updates!"
          fi

      - name: Build Android Release APK & App Bundle
        working-directory: mobile
        run: |
          RAW_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Building Version: $CLEAN_VERSION (Version Code / Build Number: $BUILD_NUMBER)"
          flutter build apk --release --split-per-abi --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"
          flutter build appbundle --release --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"

      - name: Prepare Release Assets
        id: prep
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          # Lightweight arm64 APK (recommended for 99% of modern Android devices)
          if [ -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "JainJinvani-${VERSION}-arm64.apk"
          fi
          # Universal APK (works on all architectures)
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "JainJinvani-${VERSION}-universal.apk"
          # Standard name fallback
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "JainJinvani-${VERSION}.apk"
          # Google Play App Bundle
          cp mobile/build/app/outputs/bundle/release/app-release.aab "JainJinvani-${VERSION}.aab"
          echo "tag_name=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: Jain Jinvani Mobile App ${{ steps.prep.outputs.tag_name }}
          body: |
            ## 📱 जैन जिनवाणी मोबाइल ऐप (${{ steps.prep.outputs.tag_name }})

            जैन जिनवाणी (Jain Jinvani) का आधिकारिक एंड्रॉइड ऐप संस्करण।

            ### ✨ मुख्य विशेषताएं (Key Features):
            - **100% ऑफ़लाइन (Offline First):** बिना इंटरनेट कनेक्शन के संपूर्ण जैन पूजा, आरती, स्तोत्र, पाठ एवं चालीसा।
            - **विशाल संग्रह:** 700+ धार्मिक रचनाएं, तीर्थंकर परिचय एवं नित्य नियम।
            - **ऑडियो प्लेयर:** णमोकार महामंत्र एवं भक्तामर स्तोत्र शुद्ध उच्चारण सहित।
            - **दिव्य डार्क मोड:** पढ़ने में अत्यंत सुगम एवं मनमोहक इंटरफ़ेस।
            - **सुपरफास्ट एवं हल्का:** 60/120 FPS स्मूथ स्क्रॉलिंग और न्यूनतम स्टोरेज उपयोग।

            ---

            ### 📥 कैसे इंस्टॉल करें (How to Install):
            1. **अनुशंसित (Recommended):** नीचे **Assets** में से **`JainJinvani-${{ steps.prep.outputs.tag_name }}-arm64.apk`** डाउनलोड करें (सभी आधुनिक फ़ोन के लिए सबसे हल्का एवं सबसे तेज़)।
            2. **सभी फ़ोन्स के लिए (Universal):** यदि पुराना फ़ोन हो तो **`JainJinvani-${{ steps.prep.outputs.tag_name }}-universal.apk`** डाउनलोड करें।
            3. फ़ोन में डाउनलोड हुई फ़ाइल खोलें और **Install** दबाएं।
            4. यदि फ़ोन पूछे तो *"Allow installation from this source / Chrome"* को चालू करें।
          files: |
            JainJinvani-*.apk
            JainJinvani-*.aab
          draft: false
          prerelease: false
