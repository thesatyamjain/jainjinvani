name: Build & Release Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Release Type (वर्ज़न का प्रकार चुनें)'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
      custom_version:
        description: 'Custom Version (यदि "custom" चुना हो, उदा. v2.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # If mobile/assets/web/index.html is missing, build web assets
      - name: Verify or Build Web Assets
        run: |
          if [ ! -f "mobile/assets/web/index.html" ]; then
            echo "Mobile assets not found. Installing Node.js & building web assets..."
            npm ci
            npm run sync:mobile
          else
            echo "Pre-built web assets found in mobile/assets/web/. Skipping redundant web build to save ~3-4 minutes!"
          fi

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure Keystore Signing
        working-directory: mobile/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Configuring release signing from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
            cat <<EOF > key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            echo "Release keystore configured from GitHub Secrets."
          elif [ -f upload-keystore.jks ] && [ -f key.properties ]; then
            echo "Using committed permanent project release keystore."
          else
            echo "::warning::Keystore not found. Releases will fall back to debug signing."
          fi

      - name: Determine Release Version
        id: versioning
        run: |
          git fetch --tags --force 2>/dev/null || true
          
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          CUSTOM_VER="${{ github.event.inputs.custom_version }}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Using pushed git tag: $TAG_NAME"
          elif [ "$BUMP_TYPE" = "custom" ] && [ -n "$CUSTOM_VER" ]; then
            TAG_NAME="$CUSTOM_VER"
            if [[ ! "$TAG_NAME" =~ ^v ]]; then
              TAG_NAME="v$TAG_NAME"
            fi
            echo "Using custom version from input: $TAG_NAME"
          else
            # Find highest existing semantic tag (e.g. v1.0.1)
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v1.0.0"
            fi
            echo "Latest tag found in repository: $LATEST_TAG"
            
            CLEAN_LATEST="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_LATEST"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            
            if [ "$BUMP_TYPE" = "major" ]; then
              NEW_MAJOR=$((MAJOR + 1))
              TAG_NAME="v${NEW_MAJOR}.0.0"
            elif [ "$BUMP_TYPE" = "minor" ]; then
              NEW_MINOR=$((MINOR + 1))
              TAG_NAME="v${MAJOR}.${NEW_MINOR}.0"
            else
              # Default: patch (e.g. 1.0.1 -> 1.0.2)
              NEW_PATCH=$((PATCH + 1))
              TAG_NAME="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
            echo "Calculated [$BUMP_TYPE] release tag: $TAG_NAME"
          fi
          
          CLEAN_VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Build Android Release APKs
        working-directory: mobile
        run: |
          CLEAN_VERSION="${{ steps.versioning.outputs.clean_version }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Building Version: $CLEAN_VERSION (Version Code: $BUILD_NUMBER)"
          flutter build apk --release --split-per-abi --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"

      - name: Prepare Release Assets & Checksums
        id: prep
        run: |
          VERSION="${{ steps.versioning.outputs.tag }}"
          
          # 1. Standardize APK filenames
          if [ -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "JainJinvani-${VERSION}-arm64.apk"
          fi
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "JainJinvani-${VERSION}-universal.apk"
          
          # 2. Generate SHA-256 Checksums (Industry Security Standard)
          sha256sum JainJinvani-${VERSION}-*.apk > SHA256SUMS.txt
          
          # 3. Extract exact file size and hash for release verification table
          ARM64_SIZE="~35 MB"
          ARM64_HASH="N/A"
          if [ -f "JainJinvani-${VERSION}-arm64.apk" ]; then
            ARM64_SIZE=$(du -h "JainJinvani-${VERSION}-arm64.apk" | cut -f1)
            ARM64_HASH=$(sha256sum "JainJinvani-${VERSION}-arm64.apk" | awk '{print $1}')
          fi
          
          UNI_SIZE=$(du -h "JainJinvani-${VERSION}-universal.apk" | cut -f1)
          UNI_HASH=$(sha256sum "JainJinvani-${VERSION}-universal.apk" | awk '{print $1}')
          
          # 4. Generate structured Industry-Standard Release Notes
          cat << 'EOF' > RELEASE_BODY.md
## 📱 जिनवाणी (Jain Jinvani) - ${{ steps.versioning.outputs.tag }}

सम्पूर्ण जैन धर्म ग्रंथ, भक्तामर स्तोत्र, णमोकार महामंत्र, जैन पूजा, आरती, स्तुति, चालीसा, तीर्थंकर परिचय एवं पंचांग का 100% ऑफ़लाइन डिजिटल संग्रह।

### 📦 पैकेज विवरण (Package Metadata):
- **Package Name:** `com.jainjinvani.app`
- **Minimum Requirements:** Android 6.0 (API 23)+
- **Target SDK:** Android 15 (API 35)
- **Build Number:** `${{ github.run_number }}`
- **Signing Scheme:** Verified Release Keystore (v1 + v2 + v3 Signature Scheme)

---

### 🔐 सुरक्षा एवं चेकसम (Verification & Checksums):
| पैकेज (Package) | आर्किटेक्चर (Architecture) | साइज़ (Size) | SHA-256 Checksum |
| :--- | :--- | :--- | :--- |
EOF

          echo "| \`JainJinvani-${VERSION}-arm64.apk\` | **ARM64-v8a** *(Recommended)* | ${ARM64_SIZE} | \`${ARM64_HASH}\` |" >> RELEASE_BODY.md
          echo "| \`JainJinvani-${VERSION}-universal.apk\` | **Universal** *(All Devices)* | ${UNI_SIZE} | \`${UNI_HASH}\` |" >> RELEASE_BODY.md

          cat << 'EOF' >> RELEASE_BODY.md

> 💡 **टिप:** सभी आधुनिक स्मार्टफ़ोन (99% डिवाइस) के लिए **`arm64`** वर्ज़न सबसे हल्का और सबसे तेज़ चलता है। पुराना फ़ोन होने पर ही **`universal`** का उपयोग करें।

---

### 📥 इंस्टॉलेशन निर्देश (Installation Guide):
1. नीचे **Assets** में से अपने डिवाइस के अनुसार APK डाउनलोड करें।
2. डाउनलोड पूरी होने पर फ़ाइल खोलें और **Install** दबाएं।
3. यदि Google Play Protect पूछे, तो *"Install without scanning"* या *"Scan app"* चुनें।
4. भविष्य के सभी नए अपडेट सीधे ऐप के भीतर **1-क्लिक इन-ऐप OTA** से अपने आप मिल जाएंगे।

EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Jain Jinvani Mobile App ${{ steps.versioning.outputs.tag }}
          body_path: RELEASE_BODY.md
          files: |
            JainJinvani-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
