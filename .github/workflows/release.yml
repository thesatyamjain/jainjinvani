name: Build & Release Mobile App & Web

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Release Type (वर्ज़न का प्रकार चुनें)'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
      custom_version:
        description: 'Custom Version (यदि "custom" चुना हो, उदा. v2.1.0)'
        required: false
        default: ''
      build_apk:
        description: 'Build Android APK (ARM64 + Universal)'
        required: true
        default: true
        type: boolean
      build_aab:
        description: 'Build Android AAB (Google Play Store Bundle)'
        required: true
        default: true
        type: boolean
      build_web:
        description: 'Build Web Bundle (PWA Distribution ZIP)'
        required: true
        default: true
        type: boolean
      build_ios:
        description: 'Build iOS IPA (Unsigned IPA for Sideloading)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. PREPARE TAG (~10s)
  # =========================================================================
  prepare:
    name: Prepare Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versioning.outputs.tag }}
      clean_version: ${{ steps.versioning.outputs.clean_version }}
      build_number: ${{ github.run_number }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: versioning
        run: |
          git fetch --tags --force 2>/dev/null || true
          
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          CUSTOM_VER="${{ github.event.inputs.custom_version }}"
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            echo "Using pushed git tag: $TAG_NAME"
          elif [ "$BUMP_TYPE" = "custom" ] && [ -n "$CUSTOM_VER" ]; then
            TAG_NAME="$CUSTOM_VER"
            if [[ ! "$TAG_NAME" =~ ^v ]]; then
              TAG_NAME="v$TAG_NAME"
            fi
            echo "Using custom version from input: $TAG_NAME"
          else
            # Find highest existing semantic tag (e.g. v1.0.1)
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v1.0.0"
            fi
            echo "Latest tag found in repository: $LATEST_TAG"
            
            CLEAN_LATEST="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_LATEST"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            
            if [ "$BUMP_TYPE" = "major" ]; then
              NEW_MAJOR=$((MAJOR + 1))
              TAG_NAME="v${NEW_MAJOR}.0.0"
            elif [ "$BUMP_TYPE" = "minor" ]; then
              NEW_MINOR=$((MINOR + 1))
              TAG_NAME="v${MAJOR}.${NEW_MINOR}.0"
            else
              # Default: patch (e.g. 1.0.1 -> 1.0.2)
              NEW_PATCH=$((PATCH + 1))
              TAG_NAME="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
            echo "Calculated [$BUMP_TYPE] release tag: $TAG_NAME"
          fi
          
          CLEAN_VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

  # =========================================================================
  # 2. BUILD ANDROID APK (~2m) - RUNS SIMULTANEOUSLY
  # =========================================================================
  build-android-apk:
    name: Build Android APK
    needs: prepare
    if: github.event_name == 'push' || github.event.inputs.build_apk != false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Web Assets
        run: |
          if [ ! -f "mobile/assets/web/index.html" ]; then
            npm ci
            npm run sync:mobile
          fi

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure Keystore Signing
        working-directory: mobile/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "${{ secrets.KEYSTORE_PASSWORD }}" \
              "${{ secrets.KEY_PASSWORD }}" \
              "${{ secrets.KEY_ALIAS }}" > key.properties
          fi

      - name: Build Android Release APKs
        working-directory: mobile
        run: |
          CLEAN_VERSION="${{ needs.prepare.outputs.clean_version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          flutter build apk --release --split-per-abi --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"

      - name: Package APKs
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          mkdir -p output-apks
          if [ -f mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "output-apks/JainJinvani-${VERSION}-arm64.apk"
          fi
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "output-apks/JainJinvani-${VERSION}-universal.apk"

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: output-apks/*
          if-no-files-found: error

  # =========================================================================
  # 3. BUILD ANDROID AAB (~2m) - RUNS SIMULTANEOUSLY
  # =========================================================================
  build-android-aab:
    name: Build Android AAB
    needs: prepare
    if: github.event_name == 'push' || github.event.inputs.build_aab != false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Web Assets
        run: |
          if [ ! -f "mobile/assets/web/index.html" ]; then
            npm ci
            npm run sync:mobile
          fi

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure Keystore Signing
        working-directory: mobile/android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "${{ secrets.KEYSTORE_PASSWORD }}" \
              "${{ secrets.KEY_PASSWORD }}" \
              "${{ secrets.KEY_ALIAS }}" > key.properties
          fi

      - name: Build Android App Bundle (AAB)
        working-directory: mobile
        run: |
          CLEAN_VERSION="${{ needs.prepare.outputs.clean_version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          flutter build appbundle --release --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"

      - name: Package AAB
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          mkdir -p output-aab
          cp mobile/build/app/outputs/bundle/release/app-release.aab "output-aab/JainJinvani-${VERSION}-playstore.aab"

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: output-aab/*
          if-no-files-found: error

  # =========================================================================
  # 4. BUILD WEB BUNDLE (~1m) - RUNS SIMULTANEOUSLY
  # =========================================================================
  build-web:
    name: Build Web Bundle
    needs: prepare
    if: github.event_name == 'push' || github.event.inputs.build_web != false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Package Web Bundle ZIP
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          mkdir -p output-web
          cd dist
          zip -r "../output-web/JainJinvani-${VERSION}-web-bundle.zip" .
          cd ..

      - name: Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: output-web/*
          if-no-files-found: error

  # =========================================================================
  # 5. BUILD IOS IPA (~3.5m) - RUNS SIMULTANEOUSLY
  # =========================================================================
  build-ios:
    name: Build iOS IPA
    needs: prepare
    if: github.event_name == 'push' || (github.event.inputs.build_ios != false && github.event.inputs.build_ios != 'false')
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        working-directory: mobile
        run: |
          CLEAN_VERSION="${{ needs.prepare.outputs.clean_version }}"
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}"
          flutter build ios --release --no-codesign --build-name="$CLEAN_VERSION" --build-number="$BUILD_NUMBER"

      - name: Package Unsigned IPA
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          mkdir -p output-ios
          cd mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "../../../../output-ios/JainJinvani-${VERSION}-ios-unsigned.ipa" Payload
          cd ../../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: output-ios/*
          if-no-files-found: warn

  # =========================================================================
  # 6. PUBLISH RELEASE (~20s) - AGGREGATES ALL WORKERS
  # =========================================================================
  publish-release:
    name: Publish Release
    needs: [prepare, build-android-apk, build-android-aab, build-web, build-ios]
    if: always() && needs.prepare.result == 'success' && (needs.build-android-apk.result == 'success' || needs.build-android-aab.result == 'success' || needs.build-web.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums & Release Notes
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          
          VERSION="${{ needs.prepare.outputs.tag }}" \
          BUILD_NUMBER="${{ needs.prepare.outputs.build_number }}" \
          node .github/scripts/generate-release-body.js release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Jain Jinvani ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE_BODY.md
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
